<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ค้นหาคำสั่งคณะกรรมการวิชาการ — สพป.นครพนม เขต ๑</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&family=Noto+Serif+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d2137;--navy2:#163352;--gold:#c9973a;--gold2:#e8b75a;--cream:#f7f3ec;--cream2:#ede8df;--text:#1a1a1a;--muted:#6b6560;--border:rgba(0,0,0,0.1);--white:#ffffff;--green:#2d7d2d;--green-bg:#e8f4e8;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sarabun',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;}
.header{background:var(--navy);color:white;box-shadow:0 2px 12px rgba(0,0,0,0.3);}
.header-inner{max-width:700px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;gap:14px;}
.header-emblem{font-size:28px;flex-shrink:0;}
.header-text h1{font-family:'Noto Serif Thai',serif;font-size:16px;font-weight:600;line-height:1.3;}
.header-text p{font-size:12px;color:rgba(255,255,255,0.55);margin-top:2px;}
.main{max-width:700px;margin:0 auto;padding:36px 24px 80px;}
.search-section{margin-bottom:32px;}
.search-title{font-family:'Noto Serif Thai',serif;font-size:18px;color:var(--navy);margin-bottom:6px;font-weight:600;}
.search-sub{font-size:13px;color:var(--muted);margin-bottom:16px;}
.search-wrap{position:relative;}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:18px;}
#schoolSearch{width:100%;padding:14px 14px 14px 48px;font-family:'Sarabun',sans-serif;font-size:16px;border:2px solid var(--cream2);border-radius:14px;background:var(--white);outline:none;transition:border-color 0.2s,box-shadow 0.2s;}
#schoolSearch:focus{border-color:var(--navy);box-shadow:0 0 0 4px rgba(13,33,55,0.08);}
#schoolSearch::placeholder{color:#b0a99f;}
.autocomplete-list{position:absolute;top:100%;left:0;right:0;background:var(--white);border:1.5px solid var(--navy);border-top:none;border-radius:0 0 14px 14px;max-height:320px;overflow-y:auto;z-index:100;display:none;box-shadow:0 8px 24px rgba(0,0,0,0.12);}
.autocomplete-item{padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);transition:background 0.1s;}
.autocomplete-item:last-child{border-bottom:none;}
.autocomplete-item:hover,.autocomplete-item.active{background:rgba(13,33,55,0.05);}
.ac-name{font-size:15px;color:var(--navy);font-weight:500;}
.ac-name mark{background:rgba(201,151,58,0.3);color:inherit;border-radius:2px;padding:0 1px;}
.ac-amphoe{font-size:12px;color:var(--muted);margin-top:2px;}
.ac-icon{font-size:18px;flex-shrink:0;}

/* Result */
.result-card{background:var(--white);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:none;}
.result-header{background:var(--navy);color:white;padding:20px 24px;}
.result-header h2{font-family:'Noto Serif Thai',serif;font-size:18px;font-weight:600;margin-bottom:4px;}
.result-header p{font-size:12px;color:rgba(255,255,255,0.6);}
.result-stats{display:flex;gap:10px;padding:16px 24px;background:var(--cream);border-bottom:1px solid var(--border);flex-wrap:wrap;}
.stat-chip{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:5px 12px;font-size:13px;color:var(--muted);}
.stat-chip b{color:var(--navy);font-weight:600;}
.orders-list{padding:0;}
.order-item{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid rgba(0,0,0,0.05);transition:background 0.15s;}
.order-item:last-child{border-bottom:none;}
.order-item:hover{background:rgba(201,151,58,0.04);}
.order-num{width:28px;height:28px;border:1.5px solid var(--gold);color:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
.order-detail{flex:1;min-width:0;}
.order-desc{font-size:14px;color:var(--text);line-height:1.5;margin-bottom:3px;}
.order-meta{font-size:12px;color:var(--muted);}
.btn-open{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;background:var(--navy);color:white;border-radius:8px;font-family:'Sarabun',sans-serif;font-size:13px;font-weight:500;text-decoration:none;flex-shrink:0;}
.btn-open:hover{background:var(--navy2);}
.no-orders{padding:32px 24px;text-align:center;color:var(--muted);font-size:14px;}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state .icon{font-size:56px;margin-bottom:12px;}
.empty-state p{font-size:15px;line-height:1.7;}
.footer{text-align:center;padding:20px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);margin-top:40px;}
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="header-emblem">📋</div>
    <div class="header-text">
      <h1>ทะเบียนคำสั่งคณะกรรมการวิชาการ</h1>
      <p>สำนักงานเขตพื้นที่การศึกษาประถมศึกษานครพนม เขต ๑</p>
    </div>
  </div>
</header>
<main class="main">
  <div class="search-section">
    <div class="search-title">ค้นหาโรงเรียนของคุณ</div>
    <div class="search-sub">พิมพ์ชื่อโรงเรียนเพื่อดูประวัติคำสั่งคณะกรรมการวิชาการ</div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="schoolSearch" placeholder="เช่น สุนทรวิจิตร, บ้านนาทราย..." autocomplete="off">
      <div class="autocomplete-list" id="acList"></div>
    </div>
  </div>
  <div class="result-card" id="resultCard">
    <div class="result-header">
      <h2 id="rName"></h2>
      <p id="rMeta"></p>
    </div>
    <div class="result-stats" id="rStats"></div>
    <div class="orders-list" id="rOrders"></div>
  </div>
  <div class="empty-state" id="emptyState">
    <div class="icon">🏫</div>
    <p>พิมพ์ชื่อโรงเรียนด้านบน<br>เพื่อดูประวัติคำสั่งคณะกรรมการวิชาการ</p>
  </div>
</main>
<footer class="footer">ระบบ backup คำสั่งคณะกรรมการวิชาการ · สพป.นครพนม เขต ๑</footer>
<script>
const GITHUB_RAW='https://raw.githubusercontent.com/nakhonphanom-pk1/board-orders-nkp1/main/data.json';
const DUPLICATE_NAMES=['บ้านดงยอ','บ้านหนองกุง','บ้านโคกกลาง','บ้านหนองแซง','บ้านวังยาง','บ้านนาขาม'];
const AMPHOE_MAP={
  '1048190060':'เมืองนครพนม','1048190156':'ธาตุพนม',
  '1048190204':'นาแก','1048190336':'เรณูนคร',
  '1048190299':'ปลาปาก','1048190319':'เรณูนคร',
  '1048190044':'เมืองนครพนม','1048190332':'เรณูนคร',
  '1048190296':'ปลาปาก','1048190442':'วังยาง',
  '1048190295':'ปลาปาก','1048190350':'เรณูนคร'
};

let allSchools=[];

function thaiDate(iso){
  if(!iso)return'';
  const d=new Date(iso);
  const m=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return d.getDate()+' '+m[d.getMonth()]+' '+(d.getFullYear()+543);
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hi(text,q){
  if(!q)return esc(text);
  return esc(text).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark>${m}</mark>`);
}
function getAmphoe(sch_id){return AMPHOE_MAP[sch_id]||'';}
function isDuplicate(name){return DUPLICATE_NAMES.includes(name);}

function showResult(school){
  document.getElementById('emptyState').style.display='none';
  const card=document.getElementById('resultCard');
  card.style.display='block';
  const orders=school.orders||[];
  const amphoe=getAmphoe(school.sch_id);
  document.getElementById('rName').textContent=school.name;
  document.getElementById('rMeta').textContent=school.sch_id+(amphoe?' · อำเภอ'+amphoe:'');
  document.getElementById('rStats').innerHTML=`
    <div class="stat-chip">คำสั่งทั้งหมด <b>${orders.length}</b> ฉบับ</div>
    ${orders.length>0?`<div class="stat-chip">ล่าสุด <b>${thaiDate(orders[0].created_at)}</b></div>`:''}
  `;
  document.getElementById('rOrders').innerHTML=orders.length>0
    ?orders.map((o,i)=>`<div class="order-item">
        <div class="order-num">${i+1}</div>
        <div class="order-detail">
          <div class="order-desc">${esc(o.description||'-')}</div>
          <div class="order-meta">📝 ${esc(o.upload_user||'')} &nbsp;📅 ${thaiDate(o.created_at)}</div>
        </div>
        <a class="btn-open" href="${esc(o.url)}" target="_blank">📄 เปิดไฟล์</a>
      </div>`).join('')
    :`<div class="no-orders">⚠️ ยังไม่มีคำสั่งในระบบ<br><span style="font-size:12px;color:var(--muted)">กรุณาติดต่อสำนักงานเขต</span></div>`;
}

function renderAC(results,q){
  const list=document.getElementById('acList');
  if(results.length===0){list.style.display='none';return;}
  list.innerHTML=results.map((s,i)=>{
    const amphoe=getAmphoe(s.sch_id);
    const showAmphoe=isDuplicate(s.name)&&amphoe;
    return`<div class="autocomplete-item" data-idx="${i}" onmousedown="selectSchool(${allSchools.indexOf(s)})">
      <span class="ac-icon">🏫</span>
      <div>
        <div class="ac-name">${hi(s.name,q)}</div>
        ${showAmphoe?`<div class="ac-amphoe">อำเภอ${amphoe}</div>`:''}
      </div>
    </div>`;
  }).join('');
  list.style.display='block';
}

function selectSchool(idx){
  const s=allSchools[idx];
  document.getElementById('schoolSearch').value=s.name+(isDuplicate(s.name)&&getAmphoe(s.sch_id)?' (อ.'+getAmphoe(s.sch_id)+')':'');
  document.getElementById('acList').style.display='none';
  showResult(s);
}

async function init(){
  try{
    const res=await fetch(GITHUB_RAW+'?t='+Date.now());
    const data=await res.json();
    allSchools=data.schools||[];
    const input=document.getElementById('schoolSearch');
    input.addEventListener('input',e=>{
      const q=e.target.value.trim();
      if(!q){document.getElementById('acList').style.display='none';return;}
      const results=allSchools.filter(s=>(s.name||'').includes(q)).slice(0,8);
      renderAC(results,q);
    });
    input.addEventListener('blur',()=>setTimeout(()=>document.getElementById('acList').style.display='none',150));
    input.addEventListener('focus',e=>{
      if(e.target.value.trim()){
        const results=allSchools.filter(s=>(s.name||'').includes(e.target.value.trim())).slice(0,8);
        renderAC(results,e.target.value.trim());
      }
    });
  }catch(e){
    document.getElementById('emptyState').innerHTML='<div class="icon">⚠️</div><p>ไม่สามารถโหลดข้อมูลได้<br>กรุณาลองใหม่อีกครั้ง</p>';
  }
}
init();
</script>
</body>
</html>
